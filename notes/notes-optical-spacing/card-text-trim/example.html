<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=block" rel="stylesheet">
<style>
body{margin:0;background:#0a0a0a;font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased;padding:40px;display:flex;align-items:flex-start;gap:80px}
.card{width:320px;padding:24px;border-radius:16px;background:#161616;box-shadow:inset 0 0 0 1px rgb(255 255 255/.07)}
.trim{text-box:trim-both cap alphabetic}
h3{margin:0;font-size:18px;line-height:28px;font-weight:500;color:#f5f5f5}
p{margin:0;font-size:14px;line-height:20px;color:#737373}
ul{list-style:none;margin:20px 0 0;padding:0;font-size:14px;line-height:20px;color:#e5e5e5}
li+li{margin-top:12px}
li span:first-child{display:inline-block;width:144px}
li span+span{color:#737373}
</style></head><body>
<div class="card"><h3>Team members</h3><p>3 of 5 seats used</p><ul><li><span>Ana Lima</span><span>Admin</span></li><li><span>Ben Cho</span><span>Editor</span></li><li><span>Kai Ross</span><span>Viewer</span></li></ul></div>
<div class="card trim"><h3>Team members</h3><p>3 of 5 seats used</p><ul><li><span>Ana Lima</span><span>Admin</span></li><li><span>Ben Cho</span><span>Editor</span></li><li><span>Kai Ross</span><span>Viewer</span></li></ul></div>
</body></html>
